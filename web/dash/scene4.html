<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WattNot · Why it's different</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./metatools.css"><link rel="stylesheet" href="./chrome.css"><script src="./chrome.js" defer></script>
<style>
body{margin:0;padding:32px 24px;background:#080B10;color:#F3F0F7;font-family:'Source Sans 3',sans-serif;min-height:100vh;box-sizing:border-box}
.s4-wrap{max-width:1180px;margin:0 auto}
.s4-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.s4-line{font-family:'Fira Code',monospace;font-size:12px;color:#B2A6C3;margin-right:8px}
.s4-big{font-family:'Fira Code',monospace;font-size:20px;color:#F6DBC0;margin:6px 0}
.s4-mono{font-family:'Fira Code',monospace;font-size:12px;color:#F3F0F7;word-break:break-all;margin:4px 0 6px}
.s4-src{margin-top:10px;font-size:10.5px;color:#8F86A0}
.s4-t{width:100%;border-collapse:collapse;font-size:11.5px;color:#CBC4D6}.s4-t th{text-align:left;color:#8F86A0;font-weight:600}.s4-t td{padding:3px 4px;border-top:1px solid rgba(255,255,255,.06)}
.s4-keep td{color:#9FE0B8}.s4-back td:last-child{color:#E0A3B2}
.s4-l{margin:4px 0;padding-left:16px;font-size:12.5px;color:#CBC4D6;line-height:1.45}
.s4-img{width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin:4px 0;background:#0d0f16}
.s4-btn{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;background:rgba(178,166,195,.14);color:#F3F0F7;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.18)}
.s4-chip{font-size:10px;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:middle;font-family:'Source Sans 3',sans-serif;font-weight:600}
.s4-measured,.s4-live{background:rgba(80,200,140,.18);color:#9FE0B8}.s4-estimate{background:rgba(240,200,90,.18);color:#F0D27A}.s4-synthetic,.s4-mock{background:rgba(224,163,178,.2);color:#E0A3B2}
</style></head><body><div class="s4-wrap"><div id="s4"></div></div>
<script type="module">import { mountScene4 } from './scene4.js'; mountScene4(document.getElementById('s4'), location.search).catch(e => { document.getElementById('s4').textContent = 'Could not load recorded files: ' + e; });</script>
</body></html>
