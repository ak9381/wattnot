<link rel="stylesheet" href="chrome.css">
<script src="chrome.js" defer></script>
<style>
:root {
  --bg: #05070F;
  --tx: #F2F5FA;
  --mu: #7C8599;
  --ln: rgba(255, 255, 255, 0.08);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  background: var(--bg);
  color: var(--tx);
  font: 300 17px/1.6 "Inter Tight", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
  min-height: 100vh;
}
a {
  color: inherit;
  text-decoration: none;
}
.w {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 48px;
  text-align: left;
}
.hero {
  position: relative;
  height: 100vh;
  min-height: 720px;
  display: flex;
  align-items: center;
  overflow: hidden;
  background-color: var(--bg);
  background-image: url("img/hero-1.png");
  background-image: image-set(
    url("img/hero.webp") type("image/webp"),
    url("img/hero-1.png") type("image/png")
  );
  background-position: right center;
  background-size: cover;
  background-repeat: no-repeat;
}
.hero:after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, var(--bg) 18%, rgba(5, 7, 15, 0.55) 48%, rgba(5, 7, 15, 0) 75%),
    linear-gradient(0deg, var(--bg), transparent 25%);
  pointer-events: none;
}
.hero .w {
  position: relative;
  z-index: 2;
  width: 100%;
}
h1 {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  font-weight: 300;
  letter-spacing: -0.04em;
  line-height: 1.02;
  font-size: 88px;
  max-width: 640px;
  color: var(--tx);
}
.sub {
  color: var(--mu);
  font-size: 20px;
  margin: 26px 0 40px;
  font-weight: 300;
  max-width: 580px;
}
.cta {
  margin: 0 0 20px;
}
.btn {
  display: inline-block;
  padding: 13px 24px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  font-size: 15px;
  font-weight: 400;
  cursor: pointer;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.btn.pr {
  background: var(--tx);
  color: var(--bg);
  border-color: var(--tx);
}
.btn.pr:hover {
  opacity: 0.92;
  transform: translateY(-1px);
}
.powered {
  color: var(--mu);
  font-size: 13.5px;
  font-weight: 300;
  letter-spacing: 0.01em;
  margin-top: 24px;
}

@media (max-width: 900px) {
  h1 { font-size: 56px; }
  .w { padding: 0 24px; }
  .hero { min-height: 600px; }
}
@media (max-width: 600px) {
  h1 { font-size: 42px; }
  .sub { font-size: 17px; margin: 18px 0 28px; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="w">
    <h1>Was that agent call worth the watts?</h1>
    <p class="sub">Every watt checked, plus every dollar and litre.</p>
    <div class="cta">
      <a class="btn pr" href="runs.html">Let WattNot guide your agents</a>
    </div>
    <p class="powered">Powered by Meta Muse Spark, Wonder, Glimmer, Voice, Llama and SAM 3.1</p>
  </div>
</header>
</body>
</html>
