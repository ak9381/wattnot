<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WattNot · live</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="dash.css">
</head>
<body>
<header class="bar">
  <div class="brand"><b>WattNot</b><span class="muted"> live</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="power" class="on">Power</button>
    <button data-tab="experts">Experts</button>
  </nav>
  <div class="ctl" id="expertCtl" hidden>
    <span class="seg" id="modeSeg" title="how experts are grouped">
      <button data-mode="tier" class="on">tiers</button><button data-mode="kmeans">k-means</button>
    </span>
    <button id="armBtn" class="toggle" aria-pressed="false" title="Adaptive top-k: drop the tail experts of each token">
      <span class="lamp"></span>adaptive top-k <b id="armState">off</b>
    </button>
    <span class="seg" id="viewSeg"><button data-view="both" class="on">both</button><button data-view="flow">flow</button><button data-view="orchestra">orchestra</button></span>
    <button id="playBtn" class="ghost">pause</button>
    <button id="restartBtn" class="ghost">restart</button>
    <span class="seg" id="speedSeg"><button data-speed="1">1×</button><button data-speed="3" class="on">3×</button><button data-speed="8">8×</button></span>
  </div>
  <div class="src" id="srcChip"></div>
</header>

<main id="power" class="page on"></main>

<main id="experts" class="page">
  <section class="logcol" id="logcol"><h3>event log</h3><ol id="log"></ol></section>
  <section class="flowwrap" id="flowwrap"></section>
  <section class="orch" id="orch"></section>
  <section class="timeline" id="timeline"></section>
  <section class="caption" id="caption"></section>
</main>
<div id="tip" class="tip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
