<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #080B10;
  color: var(--v-cream, #DCD6E4);
  font-family: "Source Sans 3", Inter, system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.landing-stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background-image:
    radial-gradient(ellipse at 50% 45%, rgba(59, 58, 84, 0.45) 0%, rgba(23, 23, 36, 0.7) 50%, rgba(8, 11, 16, 0.95) 85%),
    url("img/hero-1.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.landing-content {
  position: relative;
  z-index: 2;
  max-width: 820px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
h1.headline {
  margin: 0;
  font-family: "Montserrat", system-ui, sans-serif;
  font-size: clamp(34px, 5.5vw, 56px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: #DCD6E4;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
}
p.tagline {
  margin: 0;
  font-family: "Source Sans 3", Inter, system-ui, sans-serif;
  font-size: clamp(17px, 2.2vw, 22px);
  color: #B2A6C3;
  line-height: 1.4;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
}
.actions {
  margin-top: 14px;
}
a.btn-guide {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 34px;
  border-radius: 999px;
  background: rgba(46, 43, 68, 0.65);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(220, 214, 228, 0.22);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(220, 214, 228, 0.25);
  color: #DCD6E4;
  font-family: "Montserrat", system-ui, sans-serif;
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
}
a.btn-guide:hover {
  background: rgba(59, 58, 84, 0.85);
  border-color: rgba(220, 214, 228, 0.4);
  box-shadow: 0 6px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(178, 166, 195, 0.25), inset 0 1px 0 rgba(220, 214, 228, 0.35);
  transform: translateY(-1px);
  color: #FFFFFF;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  a.btn-guide { background: #2E2B44; }
}
p.powered {
  margin: 18px 0 0;
  font-family: "Source Sans 3", Inter, system-ui, sans-serif;
  font-size: 13.5px;
  color: #8E7A9E;
  letter-spacing: 0.02em;
}
</style>

<main class="landing-stage">

    <h1 class="headline">Was that agent call worth the watts?</h1>
    <p class="tagline">Every watt checked, plus every dollar and litre.</p>
    <div class="actions">
      <a class="btn-guide" href="runs.html">Let WattNot guide your agents</a>
    </div>
    <p class="powered">Powered by Meta Muse Spark, Glimmer, Llama and SAM 3.1</p>
  </div>
</main>
