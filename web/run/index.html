<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WattNot · live run</title>
<link rel="stylesheet" href="run.css">
</head><body>
<header class="bar">
  <div class="ttl"><h1>WattNot · live run</h1>
    <p>Lowers the GPU power cap one step per try. A step is kept only if quality drops ≤ 1 pt and p99 stays within +10%.</p></div>
  <div class="bar-r">
    <span id="metacalls" class="chip mono"></span>
    <span id="runid" class="mono muted"></span>
    <span id="ex" class="chip ex" hidden>EXAMPLE · fake backend</span>
    <span class="chip theme">Push the Frontier · energy</span>
    <button id="toResults" class="btn" hidden></button>
  </div>
</header>
<div id="viewport" class="viewport" tabindex="0" aria-label="Run graph canvas">
  <div id="world" class="world"><svg id="edges" class="edges"></svg><div id="groups"></div><div id="nodes"></div></div>
  <div class="ctl" role="toolbar" aria-label="Canvas controls">
    <button id="zin" title="Zoom in (+)"></button><button id="zout" title="Zoom out (−)"></button><button id="fit" title="Fit to screen (F)"></button>
    <span id="zoomv" class="mono muted"></span>
  </div>
  <div class="legend"><span><i class="sw wn"></i>WattNot (we build)</span><span><i class="sw mt"></i>Meta model</span><span><i class="sw rv"></i>Revert only</span><span><i class="sw op"></i>Optional path</span></div>
  <svg id="minimap" class="minimap" aria-label="Minimap"></svg>
  <div id="tip" class="tip" hidden></div>
</div>
<aside id="drawer" class="drawer" hidden aria-label="Node details"><button id="dclose" class="x" title="Close (Esc)"></button><div id="dbody"></div></aside>
<section id="results" class="results" hidden></section>
<footer class="timeline">
  <div class="tl-row">
    <button id="back" class="ib" title="Step back (←)"></button>
    <button id="play" class="ib primary" title="Play / pause (Space)"></button>
    <button id="fwd" class="ib" title="Step forward (→)"></button>
    <label class="spd mono">speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>×</label>
    <span id="evlabel" class="mono"></span>
    <span class="sp"></span>
    <span id="caps" class="mono cyan"></span>
  </div>
  <div class="tl-plot"><svg id="powerline" preserveAspectRatio="none"></svg>
    <input id="scrub" type="range" min="0" value="0" aria-label="Scrub through the run"></div>
</footer>
<script type="module" src="app.js"></script>
</body></html>
