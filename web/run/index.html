<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WattNot · live run</title>
<link rel="stylesheet" href="run.css">
</head><body>
<div class="amb"><i style="left:-10%;top:-20%"></i><i style="left:60%;top:10%;animation-delay:-4s"></i><i style="left:25%;top:60%;animation-delay:-7s"></i></div>
<nav class="gl"><b>WattNot</b><span class="m mu">live run</span><span id="runid" class="m mu"></span>
  <span class="sp"></span><span id="ex" class="tag ex" hidden>EXAMPLE · fake backend</span>
  <span class="tag theme">Push the Frontier · energy</span></nav>
<main>
  <section class="top"><div><div class="k">Run</div><h1 id="headline">Waiting for events…</h1></div>
    <div class="meta gl2"><div class="k">Meta API calls this run</div><div id="metacalls" class="m"></div></div></section>
  <section class="graphwrap gl2"><svg id="graph" viewBox="0 0 1240 300" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="cappath" class="m cappath"></div></section>
  <section class="power gl2"><div class="k">GPU power <span id="powlabel" class="lbl"></span></div><svg id="power" viewBox="0 0 1240 90" preserveAspectRatio="none"></svg></section>
</main>
<aside id="panel" class="gl2" hidden><button id="close" aria-label="Close">×</button><div id="pbody"></div></aside>
<div id="results" hidden></div>
<script type="module" src="app.js"></script>
</body></html>
