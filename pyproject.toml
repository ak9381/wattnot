[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattnot"
version = "0.1.0"
description = "Cut the energy and cost of LLM inference, and prove each saving with a signed receipt."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.21,<5",
]

[project.scripts]
wattnot = "wattnot.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wattnot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
