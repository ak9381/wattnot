[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattnot"
version = "0.1.0"
description = "Cut the energy and cost of LLM inference, and prove each saving with a signed receipt."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.21,<5",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "cryptography>=42,<47",
  "optuna>=3.6,<5",
]

[project.scripts]
wattnot = "wattnot.cli:main"

[project.optional-dependencies]
sign = [
  "sigstore>=3,<4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wattnot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/wattnot/certificate/render.py" = ["E501"]  # CSS and HTML strings
"src/wattnot/dash/arch.py" = ["E501", "E731"]  # long source strings in stat rows
"src/wattnot/dash/arch_spec.py" = ["E501"]  # one-line step descriptions
"src/wattnot/dash/runplan.py" = ["E501"]
"src/wattnot/dash/pipeline.py" = ["E501"]  # one-line plain-words narration strings
"tests/test_dash_runplan.py" = ["E501"]
"src/wattnot/dash/server.py" = ["E501"]  # inline login page and diagnostics text
"tests/test_dash_arch.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
