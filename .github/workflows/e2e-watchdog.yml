# Layer 4: an OFF-BOX scheduled watchdog for the long-run GPU VM.
#
# SAFE BY DEFAULT. As committed this workflow cannot delete anything:
#   * the scheduled run does nothing unless the repo VARIABLE `WATCHDOG_ENABLED` == 'true'
#     (unset by default), so a fresh clone never acts on a cron;
#   * every run defaults to DRY-RUN. A real delete needs BOTH the dispatch input mode=live AND
#     the repo variable `WATCHDOG_LIVE` == 'true' AND the credentials below present;
#   * the credentials (E2E_API_KEY / E2E_AUTH_TOKEN) live only in GitHub secrets, never the repo.
#
# It polls the SAME heartbeat the driver publishes off-box (a gist raw URL, or a file on a
# dedicated branch served by raw.githubusercontent) and runs the SAME shared rule as the on-box
# layers: `python -m wattnot.longrun.watchdog.offbox`. This is genuinely off the control box —
# GitHub's runner is the failure domain, not the box.
#
# To enable (a deliberate human step; see docs/watchdogs.md):
#   1. set repo variable  WATCHDOG_HEARTBEAT_URL  to the published heartbeat URL
#   2. set repo variable  WATCHDOG_BUDGET_CAP_INR and/or WATCHDOG_MAX_HOURS
#   3. set repo variable  WATCHDOG_ENABLED = 'true'   (lets the schedule run, still dry-run)
#   4. only to arm a real delete: set WATCHDOG_LIVE = 'true', add secrets E2E_API_KEY /
#      E2E_AUTH_TOKEN and variables E2E_VM_ID / E2E_PROJECT_ID / E2E_LOCATION, and dispatch with
#      mode=live. Confirm E2E_VM_ID is OUR VM — never delete a VM that is not ours.

name: e2e-watchdog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or live"
        type: choice
        options: [dry-run, live]
        default: dry-run
  schedule:
    # Every 15 min, but this is a BACKSTOP ONLY. GitHub's scheduled runs are best-effort and
    # often fire late (minutes, sometimes much longer, under load), so this layer must never be
    # the primary guard for a 2 h VM. The primary rails are on/near the box: the driver's own
    # in-block timeout and deadline, layers 1-3 (the local loop + the two VM-side agents), and
    # ctl.py's watchdog (deadline minus 8 min, low balance, spend cap). This cron only catches the
    # case where the whole box died with layers 1-3. The job is also a no-op unless
    # WATCHDOG_ENABLED == 'true', so this cron is inert on a default clone.
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  watchdog:
    # Gate: a manual dispatch always runs (so a human can dry-run on demand); the SCHEDULE only
    # runs when the repo opts in via the WATCHDOG_ENABLED variable.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WATCHDOG_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the shared off-box watchdog
        env:
          # Credentials: only present if a human added them as secrets; never in the repo.
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          E2E_AUTH_TOKEN: ${{ secrets.E2E_AUTH_TOKEN }}
          E2E_VM_ID: ${{ vars.E2E_VM_ID }}
          E2E_PROJECT_ID: ${{ vars.E2E_PROJECT_ID }}
          E2E_LOCATION: ${{ vars.E2E_LOCATION }}
          # Where the run publishes its heartbeat, and the caps to enforce. If the repo variable
          # is unset we fall back (below) to the dedicated branch this repo's publisher pushes to.
          HEARTBEAT_URL: ${{ vars.WATCHDOG_HEARTBEAT_URL }}
          HEARTBEAT_BRANCH: ${{ vars.WATCHDOG_HEARTBEAT_BRANCH }}
          BUDGET_CAP_INR: ${{ vars.WATCHDOG_BUDGET_CAP_INR }}
          MAX_HOURS: ${{ vars.WATCHDOG_MAX_HOURS }}
          # Live only when BOTH the dispatch input and the repo variable say so.
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          WATCHDOG_LIVE: ${{ vars.WATCHDOG_LIVE }}
        run: |
          set -euo pipefail
          # Default source: the raw URL of the dedicated branch the run's publisher force-updates
          # (wattnot.longrun.watchdog.publisher). Override with the WATCHDOG_HEARTBEAT_URL variable
          # (e.g. to point at a gist). Branch name defaults to 'watchdog-heartbeat'.
          if [ -z "${HEARTBEAT_URL:-}" ]; then
            branch="${HEARTBEAT_BRANCH:-watchdog-heartbeat}"
            HEARTBEAT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${branch}/heartbeat.json"
            echo "WATCHDOG_HEARTBEAT_URL unset; defaulting to the published branch: ${HEARTBEAT_URL}"
          fi
          live=""
          if [ "${DISPATCH_MODE:-}" = "live" ] && [ "${WATCHDOG_LIVE:-}" = "true" ]; then
            live="--live"
            echo "::warning::running in LIVE mode — a tripped cap WILL delete E2E VM ${E2E_VM_ID:-?}"
          else
            echo "dry-run (no API call will be made)"
          fi
          # Only pass a cap flag when the repo variable is set. Passing "" would parse to None and
          # DISABLE the cap; omitting the flag lets the CLI's default-on backstops (3 h, Rs2000)
          # apply. To deliberately disable a cap, set the repo variable to the literal 'unset'.
          caps=()
          if [ -n "${BUDGET_CAP_INR:-}" ]; then caps+=(--budget-cap-inr "${BUDGET_CAP_INR}"); fi
          if [ -n "${MAX_HOURS:-}" ]; then caps+=(--max-hours "${MAX_HOURS}"); fi
          # No third-party deps needed: the watchdog core is stdlib-only, so run from src without
          # a pip install (keeps the runner offline-friendly and fast).
          PYTHONPATH=src python -m wattnot.longrun.watchdog.offbox \
            --heartbeat-source "${HEARTBEAT_URL}" \
            "${caps[@]}" \
            --layer "layer4-github" \
            $live
