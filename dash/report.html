<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WattNot: run report</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=Fira+Sans:wght@400;500;600&display=swap">
<script src="static-api.js"></script>
<link rel="stylesheet" href="violet.css">
<style>
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--v-bg);color:var(--v-cream);font:16px/1.55 var(--v-body)}
  body{min-height:100vh;background:
    radial-gradient(820px 460px at 12% -8%, rgba(147,80,115,.22), transparent 60%),
    radial-gradient(760px 520px at 100% 0%, rgba(246,219,192,.10), transparent 55%),
    var(--v-bg);background-attachment:fixed}
  a{color:var(--v-peach)}
  h1,h2,h3,h4{margin:0;font-family:var(--v-head);letter-spacing:-.01em;color:var(--v-cream)}
  h1{font-size:26px;font-weight:700}
  p{margin:.35em 0;color:var(--v-sub)}
  header.top{position:sticky;top:0;z-index:20;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
    padding:12px 24px;background:rgba(42,21,48,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--v-line)}
  .brand{font-family:var(--v-head);font-weight:700;font-size:18px}.brand i{font-style:normal;color:var(--v-peach)}
  nav{display:flex;gap:6px;margin-left:8px}
  nav a{color:var(--v-sub);text-decoration:none;border:1px solid transparent;border-radius:999px;padding:6px 13px;font-size:14px}
  nav a:hover{color:var(--v-cream);border-color:var(--v-line)}
  nav a.on{color:var(--v-cream);background:var(--v-glass2);border-color:var(--v-line2)}
  .sp{flex:1}
  .note{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--v-line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--v-sub)}
  .note i{width:8px;height:8px;border-radius:50%;background:var(--v-l-replay)}
  main{max-width:860px;margin:0 auto;padding:26px 24px 80px}
  .lede{margin:4px 0 22px}
  .lede h1{margin-bottom:6px}
  .meta-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--v-mut);font-size:14px}
  .meta-line code{font-family:var(--v-num);color:var(--v-sub)}

  /* stepped flow: a left rail with a glowing peach connector line */
  .flow{position:relative;padding-left:46px}
  .flow::before{content:"";position:absolute;left:17px;top:14px;bottom:22px;width:2px;
    background:linear-gradient(var(--v-glow),rgba(246,219,192,.15));
    box-shadow:0 0 10px 1px var(--v-glow);border-radius:2px}
  .step{position:relative;margin:0 0 20px}
  .step .node{position:absolute;left:-46px;top:16px;width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;font-family:var(--v-num);font-weight:600;color:var(--v-bg);
    background:var(--v-peach);box-shadow:0 0 14px 1px var(--v-glow);z-index:1}
  .step .node.muted{background:var(--v-violet);color:var(--v-peach);box-shadow:none;border:1px solid var(--v-line)}
  .card{width:100%;text-align:left;cursor:pointer;display:block;padding:16px 18px;color:inherit;
    background:var(--v-glass);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);
    border:1px solid var(--v-line);border-radius:var(--v-r);transition:border-color .2s, transform .1s}
  .card:hover{border-color:var(--v-line2)}
  .card:focus-visible{outline:2px solid var(--v-peach);outline-offset:2px}
  .card .k{font-family:var(--v-head);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--v-mut)}
  .card .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
  .card .val{font-family:var(--v-num);font-variant-numeric:tabular-nums;font-size:27px;font-weight:600;color:var(--v-cream)}
  .card .val.peach{color:var(--v-peach)}
  .card .sub{font-size:13.5px;color:var(--v-sub);margin-top:4px}
  .card .open{font-size:12.5px;color:var(--v-mut)}
  .v-status.pass .ic,.v-status.reject .ic{font-weight:700}

  /* side panel */
  .scrim{position:fixed;inset:0;background:rgba(20,8,24,.5);z-index:40}
  aside.side{position:fixed;top:0;right:0;height:100vh;width:min(460px,94vw);z-index:50;
    transform:translateX(105%);transition:transform .28s ease;padding:22px;overflow:auto;
    border-radius:18px 0 0 18px;background:rgba(49,24,57,.92);border-left:1px solid var(--v-line)}
  aside.side.on{transform:none}
  aside.side h2{font-family:var(--v-head);font-size:20px;margin-bottom:8px}
  aside.side h4{color:var(--v-peach);font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin:16px 0 4px;font-family:var(--v-head)}
  aside.side p{color:var(--v-cream)}
  aside.side .btn{float:right;background:var(--v-glass2);border:1px solid var(--v-line2);color:var(--v-cream);
    border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:14.5px;margin:6px 0}
  .kv dt{color:var(--v-mut)}.kv dd{margin:0;color:var(--v-cream);font-family:var(--v-num);font-variant-numeric:tabular-nums}
  .dl{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--v-glass2);
    border:1px solid var(--v-line2);border-radius:12px;padding:9px 14px;color:var(--v-peach);text-decoration:none}
  .dl:hover{border-color:var(--v-peach)}
  pre{white-space:pre-wrap;word-break:break-word;background:rgba(20,8,24,.5);border:1px solid var(--v-line);
    border-radius:10px;padding:10px;color:var(--v-cream);font-family:var(--v-num);font-size:12.5px;max-height:300px;overflow:auto}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--v-mut);margin:4px 0 18px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  @media (max-width:640px){.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Watt<i>Not</i></div>
  <nav>
    <a href="runs.html">All runs</a>
    <a href="v2.html">Live dashboard</a>
    <a class="on" aria-current="page" href="#">Report</a>
  </nav>
  <span class="sp"></span>
  <span class="note"><i aria-hidden="true"></i>Replay of measured logs</span>
</header>
<main>
  <div class="lede" id="lede"><h1>Loading run report…</h1></div>
  <div class="legend" id="legend"></div>
  <div class="flow" id="flow"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="side" id="side" role="dialog" aria-modal="true" aria-label="Step details" aria-hidden="true">
  <button class="btn" id="sideX" aria-label="Close details">Close</button>
  <div id="sideBody"></div>
</aside>
<script type="module" src="report.js"></script>
</body>
</html>
